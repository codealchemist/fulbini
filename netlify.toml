[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npm run dev:vite"
  framework = "vite"
  targetPort = 5173
  port = 8888
  publish = "dist"
  autoLaunch = false

# Must come before the SPA catch-all below — redirects are matched in order,
# and an earlier bare "/*" would otherwise swallow API calls and hand back
# index.html instead of proxying to the function.
[[redirects]]
  from = "/api/football/*"
  to = "/.netlify/functions/football/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
